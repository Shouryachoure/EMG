; PlatformIO Configuration for ESP32 EMG Actuator Controller
;
; Build:   pio run
; Upload:  pio run -t upload
; Monitor: pio device monitor
; Test:    pio test

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

; Build flags
build_flags =
    -DWIFI_SSID=\"YOUR_SSID\"
    -DWIFI_PASSWORD=\"YOUR_PASSWORD\"
    -DUDP_PORT=8888
    -DWATCHDOG_TIMEOUT_MS=500
    -DSERIAL_DEBUG=1
    -std=gnu++17

; Library dependencies
lib_deps =
    ESP32Servo

; Serial monitor filters
monitor_filters = esp32_exception_decoder
